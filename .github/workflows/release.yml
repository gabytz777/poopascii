name: Build and publish pacman repo to GitHub Pages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update system
        run: pacman -Syu --noconfirm

      - name: Configure makepkg for CI
        run: |
          useradd -m builder
          chown -R builder:builder .
          runuser -u builder -- makepkg -f

      - name: Create pacman repo database
        run: |
          mkdir -p repo
          repo-add repo/poopascii.db poopascii-*.pkg.tar.zst
          cp poopascii-*.pkg.tar.zst repo/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4